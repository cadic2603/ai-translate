# MkDocs configuration — auto-generated API reference
# powered by mkdocstrings + Material for MkDocs.
#
# Build:    uv run mkdocs build      (output → site/)
# Preview:  uv run mkdocs serve      (http://127.0.0.1:8000)

site_name: AI Translate
site_description: A cross-platform desktop translator with CLI and MCP entry points.
# ``site_url`` is the canonical deployed URL of the *docs site* (drives
# canonical <link> tags, sitemap entries, and the base path Material
# uses for absolute links like the language switcher).  It must NOT be
# the GitHub repo URL — that path (``/cadic2603/ai-translate/``) gets
# prefixed onto every link and 404s.  GitHub Pages convention is
# ``https://<user>.github.io/<repo>/``.
site_url: https://cadic2603.github.io/ai-translate/
repo_url: https://github.com/cadic2603/ai-translate
repo_name: cadic2603/ai-translate
edit_uri: ""

# Material theme — JSDoc-style sidebar + content layout, search, dark mode.
theme:
  name: material
  # ``custom_dir`` is needed so we can ship language-pack shims for the
  # i18n plugin's ``en-US`` / ``en-UK`` locales (see
  # ``overrides/partials/languages/`` — Material only ships ``en.html``,
  # the shims re-export it under each BCP-47 code).
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    # ``navigation.instant`` (XHR page swaps) is incompatible with the
    # i18n plugin's contextual language-switcher links — the switcher
    # would always send users back to the home page in the alternate
    # language instead of the equivalent localized page.  Keep it off
    # so the switcher resolves to the matching translated URL.
    - navigation.tracking      # URL hash updates as you scroll.
    - navigation.tabs          # Top-level groups become tabs.
    - navigation.sections      # Render top-level items as section headers.
    - navigation.indexes       # Folder index pages live at the folder URL.
    - navigation.top           # Back-to-top button.
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow               # ToC scrolls to follow the active heading.
  # ``primary: custom`` defers the actual color to ``docs/stylesheets/extra.css``,
  # which mirrors the desktop app's palette (#3e79f7) so the docs and the app
  # read as the same product.  Both schemes use the same CSS variables.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

# Site-wide CSS overrides — keep this list small; per-page styling
# belongs in the page itself via ``attr_list`` or admonitions.
extra_css:
  - stylesheets/extra.css

# Markdown extensions — code highlighting, admonitions, tabbed sections.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # ``pymdownx.emoji`` + Material's twemoji index unlocks the
  # ``:material-foo:`` and ``:octicons-bar:`` shortcodes used by the
  # landing-page grid cards.  Without this, those shortcodes render as
  # literal text in the built site.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # mkdocs-autorefs is a sub-dependency of mkdocstrings.  Enable
  # ``resolve_closest`` so that when the same Python symbol gets
  # rendered under both ``/`` (English) and ``/vi/`` (Vietnamese) by
  # the i18n plugin, autorefs picks the page closest to the linker
  # rather than warning "Multiple primary URLs found" on every cross-
  # reference.  The Developer Reference is identical in both locales
  # (auto-generated from English docstrings), so any pick is correct.
  - autorefs:
      resolve_closest: true
  # mkdocs-static-i18n: per-page translations.  Pages with a
  # ``<name>.<lang>.md`` suffix (e.g. ``index.vi.md``) get rendered
  # at ``/<lang>/<name>/`` and a language switcher appears in the
  # header.  Untranslated pages fall back to the default-language
  # version so partial translation coverage is OK.
  - i18n:
      docs_structure: suffix
      languages:
        # ``en-us`` is the default locale and serves at site root (``/``).
        # The desktop app ships separate ``en-US.json`` and ``en-UK.json``
        # UI translations, so the docs mirror that split: file ``foo.md``
        # is the en-US version, ``foo.en-uk.md`` overrides for British
        # English.  Without an UK override, en-uk falls back to en-us so
        # partial translation coverage is OK.
        # Material only ships ``en.html`` as a UI language pack and the
        # i18n plugin force-overwrites ``theme.language`` to the locale
        # code on every build (mkdocs_static_i18n/reconfigure.py).  Our
        # workaround: ``overrides/partials/languages/en-US.html`` and
        # ``en-UK.html`` re-export Material's ``en`` pack under each
        # BCP-47 code so the build resolves cleanly.
        - locale: en-US
          default: true
          name: English (US)
          build: true
        - locale: en-UK
          name: English (UK)
          build: true
        # European + global locales — nav labels translated; per-page
        # Markdown bodies fall back to en-US until translated
        # ``<page>.<lang>.md`` files are added.
