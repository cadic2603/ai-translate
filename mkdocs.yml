  # mkdocstrings: auto-generates API reference from Python docstrings.
  # ``handlers.python`` lets us tune the rendering — see each :::module
  # block in docs/api/*.md for per-page options.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]                   # Resolve "src.cli" etc. against repo root.
          options:
            docstring_style: google    # Project uses Google-style docstrings.
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source      # Preserve declaration order.
            heading_level: 2
            separate_signature: true
            line_length: 80
            merge_init_into_class: true
            docstring_section_style: spacy
            # Project convention: ``_foo`` denotes module-internal helpers
            # that still carry meaningful API contracts (the codebase
            # has ~hundreds of them, all docstring-documented).  Render
            # them in the reference; only filter out dunders.
            filters:
              - "!^__[^_]"     # Skip dunders like __init__ on functions.
              - "!^_{2}"       # Skip name-mangled __foo / __bar__.

