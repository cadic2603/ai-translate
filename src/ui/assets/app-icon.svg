<?xml version="1.0" encoding="UTF-8"?>
<!--
  AI Translate app icon.

  Concept: a rounded-square badge in the app's primary blue (#3e79f7),
  with a Latin ``A`` and a CJK character ``文`` (meaning "text" /
  "language", visually distinct enough from ``A`` to read as
  cross-script translation even at 16×16 favicon size).  No arrow
  glyph — at small sizes arrows blur into noise; the two-script
  pairing alone communicates "translate".

  Vertical centering: we anchor each glyph by its baseline (the SVG
  default ``alphabetic`` dominant-baseline) instead of relying on
  ``dominant-baseline="central"``.  Qt's QSvgRenderer (SVG 1.1 Tiny)
  doesn't honour ``central`` correctly — the glyphs ended up sitting
  low on the badge.  The y values below were tuned empirically
  against the actual rendered bitmap so the visual centre of each
  glyph lands on the badge centre (y = 256), not the typographic
  centre.  If you bump the font sizes, re-run ``/tmp/render_icon.py``
  and adjust the y values until both glyphs read as centred.

  Used by:
    - QApplication.setWindowIcon (desktop + dock)
    - mkdocs theme.logo + theme.favicon (docs site)
    - Linux .desktop file Icon= field (when packaged)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded-square background. -->
  <rect width="512" height="512" rx="96" ry="96" fill="#3e79f7"/>
  <!--
    Subtle inner gloss to lift the badge off dark macOS dock / Windows
    taskbar backgrounds without going full skeuomorphic.
  -->
  <rect x="32" y="32" width="448" height="224" rx="68" ry="68"
        fill="white" fill-opacity="0.06"/>
  <!--
    Two glyphs, one per script, sized to fill ~60% of the badge width
    each so they read clearly at favicon size.  Inter for the Latin
    glyph; the CJK glyph falls back through the CJK font stack.  We
    bake font choice into ``font-family`` rather than embedding the
    fonts so the rendered raster is identical across builders.
  -->
  <g font-weight="700"
     fill="white"
     text-anchor="middle">
    <text x="160" y="360"
          font-size="320"
          font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">A</text>
    <text x="356" y="355"
          font-size="280"
          font-family="'Noto Sans CJK SC', 'Hiragino Sans', 'PingFang SC', sans-serif">文</text>
  </g>
</svg>
